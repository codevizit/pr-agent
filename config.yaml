max_chunk_chars: 12000
max_comments: 5
min_severity: medium
ignore_globs:
  - "package-lock.json"
  - "yarn.lock"
  - "pnpm-lock.yaml"
  - "poetry.lock"
  - "uv.lock"
  - "Pipfile.lock"
  - "Cargo.lock"
  - "Gemfile.lock"
  - "composer.lock"
  - "go.sum"
  - "*.min.js"
  - "*.min.css"
  - "*.map"
  - "dist/*"
  - "build/*"
  - "node_modules/*"
  - "*.png"
  - "*.jpg"
  - "*.jpeg"
  - "*.gif"
  - "*.webp"
  - "*.ico"
  - "*.pdf"
  - "*.zip"
  - "*.woff"
  - "*.woff2"
  - "*.ttf"